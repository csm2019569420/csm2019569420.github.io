<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>图片清晰化工具</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display:flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
        .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
        .upload-area {
            border: 2px dashed #d0d7e3;
            border-radius: 16px;
            padding: 40px 20px;
            background: #fafbfc;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .upload-area:hover { border-color: #4f7df3; }
        .upload-area .icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .upload-area p { color: #555; font-size: 15px; }
        .upload-area .hint { color: #aaa; font-size: 13px; margin-top: 6px; }
        #fileInput { display: none; }
        .preview-box {
            margin-top: 20px;
            position: relative;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            background: #f0f2f5;
        }
        .preview-box img { width: 100%; height: auto; display: block; }
        .preview-box .label {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff; font-size: 12px;
            padding: 4px 12px; border-radius: 20px;
        }
        .progress-wrap { margin-top: 20px; display: none; }
        .progress-bar-bg {
            width: 100%; height: 8px;
            background: #e9ecf3; border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #4f7df3, #7c5cfc);
            border-radius: 10px;
            transition: width 0.15s ease;
        }
        .progress-text { font-size: 14px; color: #4f7df3; margin-top: 8px; font-weight: 500; }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 28px;
            border: none; border-radius: 40px;
            font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            background: #e9ecf3; color: #555;
            flex: 1; min-width: 120px;
        }
        .btn-primary {
            background: #4f7df3; color: white;
            box-shadow: 0 4px 14px rgba(79,125,243,0.35);
        }
        .btn-primary:hover { background: #3b6ae0; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-success {
            background: #22c55e; color: white;
            box-shadow: 0 4px 14px rgba(34,197,94,0.35);
        }
        .btn-success:hover { background: #16a34a; }
        .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer { margin-top: 24px; font-size: 13px; color: #bbb; }
        .status-msg {
            margin-top: 12px;
            font-size: 14px;
            color: #4f7df3;
            min-height: 24px;
        }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .btn { padding: 10px 18px; font-size: 14px; min-width: 100px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✨ 图片清晰化</h1>
    <p class="sub">基于 AI 的超分辨率增强 · 2x 放大（自动适配手机）</p>
    <div class="upload-area" id="uploadArea">
        <span class="icon">🖼️</span>
        <p><strong>点击选择图片</strong></p>
        <span class="hint">支持 JPG / PNG / WebP</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" />
    <div class="preview-box" id="previewBox">
        <span class="label">原图</span>
        <img id="previewImg" src="" alt="预览" />
    </div>
    <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>
    <div class="btn-group">
        <button class="btn btn-primary" id="upscaleBtn" disabled>🚀 开始增强</button>
        <button class="btn btn-success" id="downloadBtn" disabled>⬇️ 下载结果</button>
    </div>
    <div class="status-msg" id="statusMsg">就绪，请选择一张图片</div>
    <div class="footer">模型在线加载 · 首次约20秒</div>
</div>

<!-- 依赖库 -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/default-model@latest/dist/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upscaler@latest/dist/browser/umd/upscaler.min.js"></script>

<script>
    (function() {
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const previewBox = document.getElementById('previewBox');
        const previewImg = document.getElementById('previewImg');
        const progressWrap = document.getElementById('progressWrap');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const upscaleBtn = document.getElementById('upscaleBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusMsg = document.getElementById('statusMsg');
        let currentFile = null, originalUrl = null, resultDataUrl = null;

        function setStatus(msg, isError = false) {
            statusMsg.textContent = msg;
            statusMsg.style.color = isError ? '#e74c3c' : '#4f7df3';
        }
        function setProgress(pct) {
            const clamped = Math.min(100, Math.max(0, pct));
            progressFill.style.width = clamped + '%';
            progressText.textContent = Math.round(clamped) + '%';
        }
        function resetUI() {
            resultDataUrl = null; downloadBtn.disabled = true;
            upscaleBtn.disabled = true; progressWrap.style.display = 'none';
            setProgress(0);
        }

        // 图片压缩函数（限制最长边 ≤ 2048）
        function compressImage(file, maxSize = 2048) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width <= maxSize && height <= maxSize) {
                            resolve(file);
                            return;
                        }
                        let scale = Math.min(maxSize / width, maxSize / height);
                        let newWidth = Math.floor(width * scale);
                        let newHeight = Math.floor(height * scale);
                        const canvas = document.createElement('canvas');
                        canvas.width = newWidth;
                        canvas.height = newHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, newWidth, newHeight);
                        canvas.toBlob((blob) => {
                            if (!blob) reject(new Error('压缩失败'));
                            const compressedFile = new File([blob], file.name, { type: file.type });
                            resolve(compressedFile);
                        }, file.type, 0.9);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async function(e) {
            const file = this.files && this.files[0];
            if (!file) return;
            try {
                setStatus('正在压缩图片（如需）...');
                const compressedFile = await compressImage(file, 2048);
                if (compressedFile !== file) {
                    setStatus('图片已压缩至合适尺寸');
                } else {
                    setStatus('图片尺寸合适，无需压缩');
                }
                if (originalUrl) URL.revokeObjectURL(originalUrl);
                currentFile = compressedFile;
                originalUrl = URL.createObjectURL(compressedFile);
                previewImg.src = originalUrl;
                previewBox.style.display = 'block';
                resetUI();
                upscaleBtn.disabled = false;
                setStatus('已加载: ' + file.name);
            } catch (err) {
                setStatus('压缩失败: ' + err.message, true);
            }
        });

        upscaleBtn.addEventListener('click', async function() {
            if (!currentFile) { setStatus('请先选择一张图片', true); return; }
            if (typeof Upscaler === 'undefined') {
                setStatus('错误：UpscalerJS 库未加载', true);
                return;
            }
            if (typeof DefaultUpscalerJSModel === 'undefined') {
                setStatus('错误：默认模型未加载', true);
                return;
            }
            upscaleBtn.disabled = true;
            downloadBtn.disabled = true;
            progressWrap.style.display = 'block';
            setProgress(0);
            setStatus('正在加载模型（首次约20秒）并增强...');
            try {
                const imgDataUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('读取图片失败'));
                    reader.readAsDataURL(currentFile);
                });

                const upscaler = new Upscaler({
                    model: DefaultUpscalerJSModel
                });

                let progressValue = 0;
                const progressInterval = setInterval(() => {
                    progressValue += Math.random() * 6 + 1;
                    if (progressValue > 95) progressValue = 95;
                    setProgress(progressValue);
                }, 200);
                const upscaledDataUrl = await upscaler.upscale(imgDataUrl, {
                    onProgress: (pct) => setProgress(pct * 100)
                });
                clearInterval(progressInterval);
                setProgress(100);
                resultDataUrl = upscaledDataUrl;
                downloadBtn.disabled = false;
                setStatus('✅ 增强完成！点击下载');
            } catch (err) {
                console.error('详细错误:', err);
                setStatus('❌ 失败: ' + (err.message || '未知错误'), true);
                progressWrap.style.display = 'none';
            } finally {
                upscaleBtn.disabled = false;
            }
        });

        downloadBtn.addEventListener('click', function() {
            if (!resultDataUrl) { setStatus('没有结果', true); return; }
            const baseName = currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'enhanced';
            const link = document.createElement('a');
            link.href = resultDataUrl;
            link.download = baseName + '_2x.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setStatus('⬇️ 下载已开始');
        });

        resetUI();
        setStatus('就绪，请选择一张图片');
    })();
</script>
</body>
</html>
