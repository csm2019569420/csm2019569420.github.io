<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI图片清晰化工具</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display:flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
        .sub { color: #888; font-size: 14px; margin-bottom: 12px; }
        .warn-tip{
            color:#e64340;
            font-size:13px;
            margin-bottom:16px;
        }
        .control-row{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            justify-content:center;
            margin-bottom:16px;
        }
        .control-group{
            background:#f3f6fd;
            padding:8px 12px;
            border-radius:12px;
            font-size:14px;
        }
        .upload-area {
            border: 2px dashed #d0d7e3;
            border-radius: 16px;
            padding: 40px 20px;
            background: #fafbfc;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .upload-area:hover { border-color: #4f7df3; }
        .upload-area .icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .upload-area p { color: #555; font-size: 15px; }
        .upload-area .hint { color: #aaa; font-size: 13px; margin-top: 6px; }
        #fileInput { display: none; }
        .preview-box {
            margin-top: 20px;
            position: relative;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            background: #f0f2f5;
        }
        .preview-box img { width: 100%; height: auto; display: block; }
        .preview-box .label {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff; font-size: 12px;
            padding: 4px 12px; border-radius: 20px;
        }
        .progress-wrap { margin-top: 20px; display: none; }
        .progress-bar-bg {
            width: 100%; height: 8px;
            background: #e9ecf3; border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #4f7df3, #7c5cfc);
            border-radius: 10px;
            transition: width 0.15s ease;
        }
        .progress-text { font-size: 14px; color: #4f7df3; margin-top: 8px; font-weight: 500; }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 28px;
            border: none; border-radius: 40px;
            font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            background: #e9ecf3; color: #555;
            flex: 1; min-width: 120px;
        }
        .btn-primary {
            background: #4f7df3; color: white;
            box-shadow: 0 4px 14px rgba(79,125,243,0.35);
        }
        .btn-primary:hover { background: #3b6ae0; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-success {
            background: #22c55e; color: white;
            box-shadow: 0 4px 14px rgba(34,197,94,0.35);
        }
        .btn-success:hover { background: #16a34a; }
        .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer { margin-top: 24px; font-size: 13px; color: #bbb; }
        .status-msg {
            margin-top: 12px;
            font-size: 14px;
            color: #4f7df3;
            min-height: 24px;
        }
        .quality-slider{
            width:100px;
        }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .btn { padding: 10px 18px; font-size: 14px; min-width: 100px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✨ AI图片清晰化</h1>
    <p class="sub">ESRGAN 智能放大修复</p>
    <p class="warn-tip">⚠️手机优先选择2倍放大；原图完全马赛克无法凭空生成细节</p>

    <div class="control-row">
        <div class="control-group">
            放大倍率：
            <select id="scaleSelect">
                <option value="2">2倍（手机推荐，流畅稳定）</option>
                <option value="4">4倍（电脑推荐，占用高）</option>
            </select>
        </div>
        <div class="control-group">
            输出格式：
            <select id="formatSelect">
                <option value="jpg">JPG（体积更小，推荐）</option>
                <option value="png">PNG（无损，文件巨大）</option>
            </select>
        </div>
        <div class="control-group">
            JPG画质：
            <input class="quality-slider" type="range" min="60" max="95" value="85" id="qualityRange">
            <span id="qualityText">85%</span>
        </div>
    </div>

    <div class="upload-area" id="uploadArea">
        <span class="icon">🖼️</span>
        <p><strong>点击选择图片</strong></p>
        <span class="hint">4倍图长边≤700px；2倍长边≤900px</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" />
    <div class="preview-box" id="previewBox">
        <span class="label">原图</span>
        <img id="previewImg" src="" alt="预览" />
    </div>
    <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>
    <div class="btn-group">
        <button class="btn btn-primary" id="upscaleBtn" disabled>🚀 开始增强</button>
        <button class="btn btn-success" id="downloadBtn" disabled>⬇️ 下载结果</button>
    </div>
    <div class="status-msg" id="statusMsg">就绪，请选择一张图片</div>
    <div class="footer">GPU失败直接终止，不再使用卡顿的CPU模式</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-slim@latest/dist/umd/2x.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-slim@latest/dist/umd/4x.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upscaler@latest/dist/browser/umd/upscaler.min.js"></script>

<script>
    (function() {
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const previewBox = document.getElementById('previewBox');
        const previewImg = document.getElementById('previewImg');
        const progressWrap = document.getElementById('progressWrap');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const upscaleBtn = document.getElementById('upscaleBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusMsg = document.getElementById('statusMsg');

        const scaleSelect = document.getElementById('scaleSelect');
        const formatSelect = document.getElementById('formatSelect');
        const qualityRange = document.getElementById('qualityRange');
        const qualityText = document.getElementById('qualityText');

        let currentFile = null, originalUrl = null, resultCanvas = null;
        let Upscaler2x, Upscaler4x;

        qualityRange.oninput = ()=>{
            qualityText.textContent = qualityRange.value + '%';
        };

        function setStatus(msg, isError = false) {
            statusMsg.textContent = msg;
            statusMsg.style.color = isError ? '#e74c3c' : '#4f7df3';
        }
        function setProgress(pct) {
            const clamped = Math.min(100, Math.max(0, pct));
            progressFill.style.width = clamped + '%';
            progressText.textContent = Math.round(clamped) + '%';
        }
        function resetUI() {
            resultCanvas = null; downloadBtn.disabled = true;
            upscaleBtn.disabled = true; progressWrap.style.display = 'none';
            setProgress(0);
        }

        // 图片尺寸压缩
        function compressImage(file, maxSize) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width <= maxSize && height <= maxSize) {
                            resolve(file);
                            return;
                        }
                        const scale = Math.min(maxSize / width, maxSize / height);
                        const newWidth = Math.floor(width * scale);
                        const newHeight = Math.floor(height * scale);
                        const canvas = document.createElement('canvas');
                        canvas.width = newWidth;
                        canvas.height = newHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, newWidth, newHeight);
                        canvas.toBlob((blob) => {
                            if (!blob) reject(new Error('压缩失败'));
                            const compressedFile = new File([blob], file.name, { type: file.type });
                            resolve(compressedFile);
                        }, file.type, 0.92);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // 简易降噪预处理（高斯模糊轻微降噪）
        function denoiseImage(imgEl) {
            const canvas = document.createElement('canvas');
            canvas.width = imgEl.width;
            canvas.height = imgEl.height;
            const ctx = canvas.getContext('2d');
            ctx.filter = 'blur(0.35px)';
            ctx.drawImage(imgEl,0,0);
            ctx.filter = 'none';
            return canvas;
        }

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async function(e) {
            const file = this.files && this.files[0];
            if (!file) return;
            try {
                setStatus('加载图片');
                const scale = Number(scaleSelect.value);
                const limit = scale === 4 ? 700 : 900;
                const compressedFile = await compressImage(file, limit);
                if (originalUrl) URL.revokeObjectURL(originalUrl);
                currentFile = compressedFile;
                originalUrl = URL.createObjectURL(compressedFile);
                previewImg.src = originalUrl;
                previewBox.style.display = 'block';
                resetUI();
                upscaleBtn.disabled = false;
                setStatus(`图片就绪，当前选择${scale}倍放大`);
            } catch (err) {
                setStatus('图片加载失败', true);
            }
        });

        upscaleBtn.addEventListener('click', async function() {
            if (!currentFile) return;
            upscaleBtn.disabled = true;
            downloadBtn.disabled = true;
            progressWrap.style.display = 'block';
            setProgress(0);
            const scale = Number(scaleSelect.value);
            setStatus(`GPU执行${scale}倍增强中，请勿锁屏切后台`);

            try {
                // 读取原图
                const reader = new FileReader();
                reader.readAsDataURL(currentFile);
                const imgDataUrl = await new Promise(resolve => reader.onload = e=>resolve(e.target.result));
                const img = new Image();
                img.src = imgDataUrl;
                await new Promise(res=>img.onload=res);

                // 降噪预处理
                const denoiseCanvas = denoiseImage(img);

                // 选择对应模型
                const model = scale === 2 ? ESRGANSlim2x : ESRGANSlim4x;
                const upscaler = new Upscaler({model});
                const resultUrl = await upscaler.upscale(denoiseCanvas, {
                    patchSize: scale===4 ? 64 : 80,
                    padding: scale===4 ? 2 : 3,
                    onProgress:p=>setProgress(p*100)
                });

                // 渲染结果到canvas方便导出格式
                const resImg = new Image();
                resImg.src = resultUrl;
                await new Promise(res=>resImg.onload=res);
                resultCanvas = document.createElement('canvas');
                resultCanvas.width = resImg.width;
                resultCanvas.height = resImg.height;
                resultCanvas.getContext('2d').drawImage(resImg,0,0);

                setProgress(100);
                downloadBtn.disabled = false;
                setStatus('✅ AI增强完成！');
            } catch (err) {
                console.error(err);
                setStatus('❌ GPU显存不足失败！手机建议切换2倍尝试', true);
                progressWrap.style.display = 'none';
            } finally {
                upscaleBtn.disabled = false;
            }
        });

        downloadBtn.addEventListener('click', async function() {
            if (!resultCanvas) return;
            const format = formatSelect.value;
            const quality = Number(qualityRange.value)/100;
            const baseName = currentFile ? currentFile.name.replace(/\.[^.]+$/,'') : 'enhanced';
            const scale = scaleSelect.value;
            let blob, linkName;

            if(format === 'jpg'){
                blob = await new Promise(res=>resultCanvas.toBlob(res, 'image/jpeg', quality));
                linkName = `${baseName}_${scale}x.jpg`;
            }else{
                blob = await new Promise(res=>resultCanvas.toBlob(res, 'image/png'));
                linkName = `${baseName}_${scale}x.png`;
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = linkName;
            a.click();
            URL.revokeObjectURL(url);
            setStatus('文件开始下载');
        });
        resetUI();
    })();
</script>
</body>
</html>
