<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>4倍图片清晰化</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display:flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
        .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
        .upload-area {
            border: 2px dashed #d0d7e3;
            border-radius: 16px;
            padding: 40px 20px;
            background: #fafbfc;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .upload-area:hover { border-color: #4f7df3; }
        .upload-area .icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .upload-area p { color: #555; font-size: 15px; }
        .upload-area .hint { color: #aaa; font-size: 13px; margin-top: 6px; }
        #fileInput { display: none; }
        .preview-box {
            margin-top: 20px;
            position: relative;
            display: none;
            border-radius: 12px;
            overflow: hidden;
            background: #f0f2f5;
        }
        .preview-box img { width: 100%; height: auto; display: block; }
        .preview-box .label {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff; font-size: 12px;
            padding: 4px 12px; border-radius: 20px;
        }
        .progress-wrap { margin-top: 20px; display: none; }
        .progress-bar-bg {
            width: 100%; height: 8px;
            background: #e9ecf3; border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #4f7df3, #7c5cfc);
            border-radius: 10px;
            transition: width 0.15s ease;
        }
        .progress-text { font-size: 14px; color: #4f7df3; margin-top: 8px; font-weight: 500; }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 28px;
            border: none; border-radius: 40px;
            font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            background: #e9ecf3; color: #555;
            flex: 1; min-width: 120px;
        }
        .btn-primary {
            background: #4f7df3; color: white;
            box-shadow: 0 4px 14px rgba(79,125,243,0.35);
        }
        .btn-primary:hover { background: #3b6ae0; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-success {
            background: #22c55e; color: white;
            box-shadow: 0 4px 14px rgba(34,197,94,0.35);
        }
        .btn-success:hover { background: #16a34a; }
        .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer { margin-top: 24px; font-size: 13px; color: #bbb; }
        .status-msg {
            margin-top: 12px;
            font-size: 14px;
            color: #4f7df3;
            min-height: 24px;
        }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .btn { padding: 10px 18px; font-size: 14px; min-width: 100px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✨ 4倍图片清晰化</h1>
    <p class="sub">AI ESRGAN · 4x放大（优化移动端稳定性）</p>
    <div class="upload-area" id="uploadArea">
        <span class="icon">🖼️</span>
        <p><strong>点击选择图片</strong></p>
        <span class="hint">手机优先使用长边 ≤800 的图片</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" />
    <div class="preview-box" id="previewBox">
        <span class="label">原图</span>
        <img id="previewImg" src="" alt="预览" />
    </div>
    <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>
    <div class="btn-group">
        <button class="btn btn-primary" id="upscaleBtn" disabled>🚀 开始4倍增强</button>
        <button class="btn btn-success" id="downloadBtn" disabled>⬇️ 下载结果</button>
    </div>
    <div class="status-msg" id="statusMsg">就绪，请选择一张图片</div>
    <div class="footer">模型在线加载 · CPU模式极易卡顿，尽量保证GPU运行</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-slim@latest/dist/umd/4x.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upscaler@latest/dist/browser/umd/upscaler.min.js"></script>

<script>
    (function() {
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const previewBox = document.getElementById('previewBox');
        const previewImg = document.getElementById('previewImg');
        const progressWrap = document.getElementById('progressWrap');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const upscaleBtn = document.getElementById('upscaleBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusMsg = document.getElementById('statusMsg');
        let currentFile = null, originalUrl = null, resultDataUrl = null;

        function setStatus(msg, isError = false) {
            statusMsg.textContent = msg;
            statusMsg.style.color = isError ? '#e74c3c' : '#4f7df3';
        }
        function setProgress(pct) {
            const clamped = Math.min(100, Math.max(0, pct));
            progressFill.style.width = clamped + '%';
            progressText.textContent = Math.round(clamped) + '%';
        }
        function resetUI() {
            resultDataUrl = null; downloadBtn.disabled = true;
            upscaleBtn.disabled = true; progressWrap.style.display = 'none';
            setProgress(0);
        }

        // 图片压缩工具
        function compressImage(file, maxSize) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width <= maxSize && height <= maxSize) {
                            resolve(file);
                            return;
                        }
                        const scale = Math.min(maxSize / width, maxSize / height);
                        const newWidth = Math.floor(width * scale);
                        const newHeight = Math.floor(height * scale);
                        const canvas = document.createElement('canvas');
                        canvas.width = newWidth;
                        canvas.height = newHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, newWidth, newHeight);
                        canvas.toBlob((blob) => {
                            if (!blob) reject(new Error('压缩失败'));
                            const compressedFile = new File([blob], file.name, { type: file.type });
                            console.log('压缩尺寸', newWidth, newHeight);
                            resolve(compressedFile);
                        }, file.type, 0.92);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async function(e) {
            const file = this.files && this.files[0];
            if (!file) return;
            try {
                setStatus('加载图片...');
                // 正常GPU模式上限1000px
                const compressedFile = await compressImage(file, 1000);
                if (originalUrl) URL.revokeObjectURL(originalUrl);
                currentFile = compressedFile;
                originalUrl = URL.createObjectURL(compressedFile);
                previewImg.src = originalUrl;
                previewBox.style.display = 'block';
                resetUI();
                upscaleBtn.disabled = false;
                setStatus('已加载图片：' + file.name);
            } catch (err) {
                setStatus('图片加载失败', true);
            }
        });

        upscaleBtn.addEventListener('click', async function() {
            if (!currentFile) return;
            upscaleBtn.disabled = true;
            downloadBtn.disabled = true;
            progressWrap.style.display = 'block';
            setProgress(0);
            setStatus('开始GPU模式4倍增强');

            try {
                const reader = new FileReader();
                reader.readAsDataURL(currentFile);
                const imgDataUrl = await new Promise(resolve => reader.onload = e=>resolve(e.target.result));
                const upscaler = new Upscaler({model: ESRGANSlim4x});
                // GPU模式参数
                const output = await upscaler.upscale(imgDataUrl, {
                    patchSize:96,
                    padding:3,
                    onProgress:p=>setProgress(p*100)
                });
                setProgress(100);
                resultDataUrl = output;
                downloadBtn.disabled = false;
                setStatus('✅ 增强完成，点击下载');
            } catch (err) {
                console.log('GPU失败，切换CPU',err);
                setStatus('GPU内存不足，切换CPU模式，正在二次缩小图片');
                try{
                    // CPU模式强制缩小到长边800以内，降低运算压力
                    const cpuFile = await compressImage(currentFile,800);
                    const reader = new FileReader();
                    reader.readAsDataURL(cpuFile);
                    const imgDataUrl = await new Promise(resolve => reader.onload = e=>resolve(e.target.result));
                    await tf.setBackend('cpu');
                    await tf.ready();
                    const upscaler = new Upscaler({model: ESRGANSlim4x});
                    const output = await upscaler.upscale(imgDataUrl, {
                        patchSize:80,
                        padding:2,
                        onProgress:p=>setProgress(p*100)
                    });
                    setProgress(100);
                    resultDataUrl = output;
                    downloadBtn.disabled = false;
                    setStatus('✅ CPU模式处理完成');
                }catch(err2){
                    setStatus('❌ CPU模式依然失败！请更换更小图片，或者使用电脑打开',true);
                    progressWrap.style.display = 'none';
                }
            } finally {
                upscaleBtn.disabled = false;
            }
        });

        downloadBtn.addEventListener('click', function() {
            if (!resultDataUrl) return;
            const baseName = currentFile ? currentFile.name.replace(/\.[^.]+$/,'') : 'enhanced';
            const a = document.createElement('a');
            a.href = resultDataUrl;
            a.download = baseName + '_4x.png';
            a.click();
            setStatus('下载已触发');
        });
        resetUI();
    })();
</script>
</body>
</html>
